<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multilingual Speech Transcriber</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #f1f5f9;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .status-badge.recording .status-dot {
            background: var(--danger);
            animation: pulse 1.2s infinite;
        }

        .status-badge.recording {
            background: #fef2f2;
            color: var(--danger);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-danger:hover {
            background: var(--danger-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .output-box {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #f8fafc;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            resize: none;
            transition: border-color 0.2s ease;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--primary);
            background: white;
        }

        .footer-note {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>AI Multilingual Transcriber</h1>
        <p>Speak in English, Telugu, or Hindi seamlessly</p>
    </div>

    <div style="text-align: center;">
        <div id="statusBadge" class="status-badge">
            <span class="status-dot"></span>
            <span id="statusText">Ready to Record</span>
        </div>
    </div>

    <div class="button-group">
        <button id="startBtn" class="btn btn-primary" onclick="startRecording()">
            <i class="fa-solid fa-microphone"></i> Start Recording
        </button>
        <button id="stopBtn" class="btn btn-danger" onclick="stopRecording()" disabled>
            <i class="fa-solid fa-square"></i> Stop & Transcribe
        </button>
    </div>

    <div class="output-box">
        <textarea id="outputTextArea" placeholder="Your spoken text will auto-transcribe in English, తెలుగు, or हिंदी script..." readonly></textarea>
    </div>

    <div class="footer-note">
        Powered by OpenAI Whisper & Spring Boot
    </div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
        audioChunks = [];
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = sendAudioToBackend;

            mediaRecorder.start();

            // UI Updates
            const badge = document.getElementById("statusBadge");
            badge.classList.add("recording");
            document.getElementById("statusText").innerText = "Listening... Speak Now";
            document.getElementById("startBtn").disabled = true;
            document.getElementById("stopBtn").disabled = false;
            document.getElementById("outputTextArea").value = "";
        } catch (err) {
            alert("Microphone access denied or not supported.");
        }
    }

    function stopRecording() {
        mediaRecorder.stop();
        
        // UI Updates
        const badge = document.getElementById("statusBadge");
        badge.classList.remove("recording");
        document.getElementById("statusText").innerText = "Transcribing with Whisper...";
        document.getElementById("startBtn").disabled = false;
        document.getElementById("stopBtn").disabled = true;
    }

    function sendAudioToBackend() {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const formData = new FormData();
        formData.append("file", audioBlob, "recording.webm");

        fetch('/api/speech/transcribe', {
            method: 'POST',
            body: formData
        })
        .then(response => response.text()) // Get raw response string first
        .then(responseText => {
            try {
                // Parse JSON response from Whisper
                const data = JSON.parse(responseText);
                document.getElementById("outputTextArea").value = data.text || responseText;
            } catch (e) {
                // Fallback for plain text response
                document.getElementById("outputTextArea").value = responseText;
            }
            document.getElementById("statusText").innerText = "Transcription Complete!";
        })
        .catch(error => {
            console.error("Error:", error);
            document.getElementById("statusText").innerText = "Error during transcription.";
        });
    }
</script>

</body>
</html>
