<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multilingual Transcriber</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 20px;
            background-color: #e5e7eb;
            color: #374151;
            margin-bottom: 24px;
        }
        .status-badge.recording {
            background-color: #fee2e2;
            color: #dc2626;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }
        button {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #recordBtn {
            background-color: #2563eb;
            color: #ffffff;
        }
        #recordBtn:hover {
            background-color: #1d4ed8;
        }
        #stopBtn {
            background-color: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }
        #stopBtn.active {
            background-color: #ef4444;
            color: #ffffff;
            cursor: pointer;
        }
        #stopBtn.active:hover {
            background-color: #dc2626;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            background-color: #f9fafb;
            color: #1f2937;
        }
        textarea:focus {
            border-color: #2563eb;
            background-color: #ffffff;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>AI Multilingual Transcriber</h1>
    <p class="subtitle">Speak in English, Telugu, or Hindi seamlessly</p>

    <div id="statusBadge" class="status-badge">Ready to record</div>

    <div class="btn-group">
        <button id="recordBtn">🎙️ Start Recording</button>
        <button id="stopBtn" disabled>⏹️ Stop & Transcribe</button>
    </div>

    <textarea id="transcriptionOutput" placeholder="Your transcription in native script will appear here..." readonly></textarea>

    <div class="footer">Powered by OpenAI Whisper & Spring Boot</div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];

    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusBadge = document.getElementById('statusBadge');
    const output = document.getElementById('transcriptionOutput');

    recordBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                await sendAudioToServer(audioBlob);
            };

            mediaRecorder.start();
            recordBtn.disabled = true;
            stopBtn.disabled = false;
            stopBtn.classList.add('active');
            statusBadge.classList.add('recording');
            statusBadge.innerText = '🔴 Recording... Speak now';
        } catch (err) {
            alert('Microphone access denied or not supported.');
        }
    });

    stopBtn.addEventListener('click', () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            stopBtn.classList.remove('active');
            statusBadge.classList.remove('recording');
            statusBadge.innerText = '⏳ Processing audio...';
        }
    });

    async function sendAudioToServer(blob) {
        const formData = new FormData();
        formData.append('file', blob, 'audio.webm');

        try {
            const response = await fetch('/api/speech/transcribe', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                output.value = data.text;
                statusBadge.innerText = '● Transcription Complete!';
            } else {
                const errText = await response.text();
                output.value = 'Error: ' + errText;
                statusBadge.innerText = '⚠️ Failed';
            }
        } catch (error) {
            output.value = 'Server Error: ' + error.message;
            statusBadge.innerText = '⚠️ Failed';
        }
    }
</script>

</body>
</html>
